name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest on PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # A real PostgreSQL server, like production (Neon), so SQLite-only
    # mistakes in models or migrations fail here instead of in production
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests on SQLite (same as local)
        run: pytest -q
      - name: Tests on PostgreSQL
        run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - name: Migrations apply cleanly to a fresh PostgreSQL database
        run: |
          psql postgresql://ci:ci@localhost:5432/ci -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
          flask db upgrade
          flask db downgrade base
          flask db upgrade
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  migrate:
    name: Migrate production database
    # Only after both test jobs pass, and only for pushes to main
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Never run two production migrations/deploys at once; queue them in push order
    concurrency:
      group: production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: backend
    env:
      # Add in GitHub: Settings -> Secrets and variables -> Actions -> DATABASE_URL
      # (use the same Neon connection string Vercel has)
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt
      - name: flask db upgrade
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::DATABASE_URL secret not set yet; skipping production migration."
            exit 0
          fi
          flask db upgrade

  deploy:
    name: Deploy to Vercel (production)
    # Only after tests pass AND the database is migrated, so new code never
    # runs against an old database schema
    needs: [migrate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      # Add in GitHub: Settings -> Secrets and variables -> Actions
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check Vercel secrets
        id: secrets
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::notice::Vercel secrets not set yet; skipping deploy (Vercel's own Git deploys still run)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/setup-node@v5
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 24
      - name: Install Vercel CLI
        if: steps.secrets.outputs.ready == 'true'
        run: npm install --global vercel@68.0.0
      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        # Uploads this commit; Vercel builds both services with the project's
        # environment variables, then promotes it to the production domain
        run: |
          url=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN")
          echo "Deployed: $url"
          echo "::notice::Deployed to production: $url"
      - name: Smoke test the live site
        if: steps.secrets.outputs.ready == 'true'
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 30 https://waikiki-carpet-cleaner.vercel.app/api/health; then exit 0; fi
            echo "health check failed, retrying in 10s..."; sleep 10
          done
          echo "::error::Production health check failed after deploy"; exit 1
