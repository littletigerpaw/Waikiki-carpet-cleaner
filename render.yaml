# Render Blueprint: creates the Flask API + a PostgreSQL database.
# Render dashboard -> New -> Blueprint -> pick this repo.
databases:
  - name: waikiki-db
    plan: free
    databaseName: waikiki
    user: waikiki

services:
  - type: web
    name: waikiki-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Apply DB migrations, create the first manager if needed, then serve
    startCommand: flask db upgrade && flask ensure-manager && gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: waikiki-db
          property: connectionString
      # You'll be asked for these when creating the Blueprint:
      - key: FRONTEND_ORIGIN        # your Netlify URL, e.g. https://waikiki.netlify.app
        sync: false
      - key: CLOUDINARY_URL         # from your Cloudinary dashboard
        sync: false
      - key: INITIAL_MANAGER_EMAIL
        sync: false
      - key: INITIAL_MANAGER_PASSWORD
        sync: false
